<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Legenda Flutuante (PiP) — Transync PT-BR ⇄ ES</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .pip-shell {
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.90);
      border: 1px solid rgba(56, 189, 248, 0.38);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    .pip-header {
      height: 32px;
      background: rgba(19, 25, 38, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag;
    }
    .pip-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .pip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .pip-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
    }
    .pip-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .pip-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .pip-feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
    }
    .pip-empty {
      margin: auto;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }
    .pip-item {
      background: rgba(26, 34, 50, 0.85);
      border-left: 3px solid #f59e0b;
      border-radius: 7px;
      padding: 7px 10px;
    }
    .pip-item.mic {
      border-left-color: #10b981;
    }
    .pip-orig {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    .pip-trans {
      font-size: var(--pip-font-size, 16px);
      font-weight: 600;
      color: #6ee7b7;
      line-height: 1.38;
    }
    .pip-item.mic .pip-trans {
      color: #fde68a;
    }
  </style>
</head>
<body>
  <div class="pip-shell" id="pipShell">
    <div class="pip-header">
      <div class="pip-title">
        <span class="pip-dot"></span>
        <span>Legenda Teams (ES ⇄ PT-BR)</span>
      </div>
      <div class="pip-controls">
        <button class="pip-btn" id="btnFontDec" title="Diminuir fonte">A-</button>
        <button class="pip-btn" id="btnFontInc" title="Aumentar fonte">A+</button>
        <button class="pip-btn" id="btnClosePip" title="Fechar janela flutuante">✕</button>
      </div>
    </div>
    <div class="pip-feed" id="pipFeed">
      <div class="pip-empty" id="pipEmpty">
        🎧 Aguardando fala no Microsoft Teams ou no seu microfone...
      </div>
    </div>
  </div>
  <script src="./pip.js"></script>
</body>
</html>
